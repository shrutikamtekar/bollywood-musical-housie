<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bollywood Housie — TV</title><link rel="stylesheet" href="/style.css"></head><body class="tv"><div class="card" id="screen"><h1>🪔 Bollywood Musical Housie</h1><p>Preparing the party…</p></div><script>
const box=document.getElementById('screen');let state;function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let [game,net]=await Promise.all([fetch('/api/public',{cache:'no-store'}),fetch('/api/network')]);state=await game.json();window.guestJoinUrl=(await net.json()).joinUrl;draw()}catch(e){box.textContent='Waiting for host…'}}function draw(){let s=state;if(!s)return;let phase=s.phase;let joinUrl=window.guestJoinUrl||null;if(s.status==='lobby'||phase==='welcome'){box.innerHTML=`<h1>🪔 Bollywood Musical Housie</h1><h2>Scan • Sing • Guess • Win!</h2><div class="tv-qr-row"><section class="tv-qr-panel"><h2>📱 Join the Game</h2>${joinUrl?`<img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(joinUrl)}" alt="Scan to join the game"><p class="tv-qr-note">Scan to get your ticket</p><p class="tv-qr-link">${safe(joinUrl)}</p>`:'<p class="error">No local network address found. Connect Mac to Wi-Fi.</p>'}</section><section class="tv-qr-panel"><h2>💸 Pay via Venmo</h2><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent('https://venmo.com/u/Shruti-Kamtekar')}" alt="Scan to pay via Venmo"><p class="tv-qr-note">Pay Shruti Kamtekar</p></section></div><p class="pill">🎟️ ${s.playerCount} tickets issued</p>`;return}if(phase==='history'){box.innerHTML='<h1>🎵 Played Songs</h1><div class="list" style="max-height:62vh;overflow:auto">'+[...s.revealed].reverse().map(x=>`<div class="listitem">${safe(x.title)}</div>`).join('')+'</div>';return}if(s.rankings){
const isActive=phase==='playing'||phase==='paused';
const secs=Math.max(0,Number(s.seconds)||0);
const timerLabel=phase==='paused'?'⏸ Paused':phase==='playing'?'🎶 Listen carefully!':phase==='reveal'?'🎵 Next song coming up':'🎵 Waiting for next song';
box.innerHTML=`<div class="tv-combined"><section class="tv-clock-panel"><h1>🎶 Song Countdown</h1><div class="timer" aria-live="off">${String(secs).padStart(2,'0')}<span style="font-size:.3em">s</span></div><p class="muted">${timerLabel}</p></section><section class="tv-rank-panel"><h2>🏆 Live Ticket Scoreboard</h2>${s.rankings.length?s.rankings.map((x,i)=>`<div class="listitem"><span>${['🥇','🥈','🥉'][i]||'🎟️'} ${safe(x.name)}</span><strong>${x.count}/15</strong></div>`).join(''):'<p>Waiting for players…</p>'}</section></div>`;return}
if(phase==='playing'||phase==='paused'){box.innerHTML=`<h1>🎶 Guess the Song!</h1><div class="timer">${s.seconds}<span style="font-size:.3em">s</span></div><p class="muted">${phase==='paused'?'⏸ Paused':'Listen carefully!'}</p>`;return}if(s.status==='finished'){box.innerHTML='<h1>🪔 Thank You for Playing!</h1><div class="title">Happy Diwali! 🎉</div>';return}box.innerHTML='<h1>🪔 Bollywood Musical Housie</h1><div class="title">Get Ready! 🎵</div>'}setInterval(()=>{if(state?.phase==='playing'&&state.seconds>0){state.seconds--;draw()}},1000);new EventSource('/api/events').onmessage=load;load();
</script></body></html>
