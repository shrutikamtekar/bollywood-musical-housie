<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bollywood Housie — TV</title><link rel="stylesheet" href="/style.css"></head><body class="tv"><div class="card" id="screen"><h1>🪔 Bollywood Musical Housie</h1><p>Preparing the party…</p></div><script>
const box=document.getElementById('screen');let state;function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let [game,net]=await Promise.all([fetch('/api/public',{cache:'no-store'}),fetch('/api/network')]);state=await game.json();window.guestJoinUrl=(await net.json()).joinUrl;draw()}catch(e){box.textContent='Waiting for host…'}}function draw(){const s=state;if(!s)return;const phase=s.status==='playing'?'manual':s.phase;const joinUrl=window.guestJoinUrl||null;
if(s.status==='lobby'||phase==='welcome'){box.innerHTML=`<h1>🪔 Bollywood Musical Housie</h1><h2>Scan • Sing • Guess • Win!</h2><div class="tv-qr-row"><section class="tv-qr-panel"><h2>📱 Join the Game</h2>${joinUrl?`<img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(joinUrl)}" alt="Join QR"><p>${safe(joinUrl)}</p>`:'<p>Connect the Mac to Wi-Fi</p>'}</section><section class="tv-qr-panel"><h2>💸 Pay via Venmo</h2><img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent('https://venmo.com/u/Shruti-Kamtekar')}" alt="Venmo QR"></section></div><p>🎟️ ${s.playerCount} tickets issued</p>`;return;}
if(s.status==='finished'){box.innerHTML='<h1>🪔 Happy Diwali!</h1><h2>Thank you for playing 🎉</h2>';return;}
const secs=Math.max(0,Number(s.seconds)||0),label=phase==='manual'?'Listen carefully and guess the song!':phase==='playing'?'🎶 Listen carefully!':['paused','gapPaused'].includes(phase)?'⏸ Paused':phase==='gap'?'Next song in…':phase==='loading'?'⏳ Waiting for audio…':'🎵 Waiting for the host';
const recent=[...(s.revealed||[])].reverse();
const ranks=s.rankings||[];
box.innerHTML=`<h1>🪔 Bollywood Musical Housie</h1><div class="tv-combined ${s.showScoreboard===true?'with-scoreboard':'solo'}"><section class="tv-clock-panel"><h2>${phase==='manual'?'🎶 Guess the Song!':phase==='gap'?'⏳ Next Song Countdown':'🎶 Song Countdown'}</h2>${phase==='manual'?'<div class="timer">🎵</div>':`<div class="timer">${(phase==='loading'?'--':String(secs).padStart(2,'0'))}<span style="font-size:.3em">s</span></div>`}<p>${label}</p></section>${s.showScoreboard===true?`<section class="tv-rank-panel"><h2>🏆 Live Scoreboard</h2>${ranks.length?ranks.map((x,i)=>`<div class="listitem"><span>${['🥇','🥈','🥉'][i]||'🎟️'} ${safe(x.name)}</span><strong>${x.count}/15</strong></div>`).join(''):'<p>No scores yet</p>'}</section>`:''}</div>${s.showRecent===true?`<section class="card" style="margin-top:20px;text-align:left"><h2>🎵 All Played Songs</h2>${recent.length?recent.map(x=>`<div class="listitem"><span>${safe(x.title)}</span></div>`).join(''):'<p>No songs finished yet</p>'}</section>`:''}`;
}
new EventSource('/api/events').onmessage=load;load();
</script></body></html>
